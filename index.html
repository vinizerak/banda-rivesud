<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banda Rive-Sud</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.12);
  --text: #ffffff;
  --muted: rgba(255,255,255,0.5);
  --accent: #ffffff;
  --accent-light: rgba(255,255,255,0.1);
  --accent-mid: rgba(255,255,255,0.7);
  --tab-h: 44px;
  --album-c1: #1a1a2e;
  --album-c2: #534AB7;
  --album-text: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
  background: var(--album-c1);
  transition: background 0.7s ease;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--cf-bg-full, #0d0d0d);
  transition: background 0.7s ease;
  z-index: -2;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: var(--cf-cover-url, none);
  background-size: cover;
  background-position: center;
  opacity: 0.07;
  filter: blur(40px);
  transform: scale(1.1);
  z-index: -1;
  pointer-events: none;
  transition: background-image 0.5s ease, opacity 0.5s ease;
}

/* ── NAV GLOBAL (cultos/ensaio) ── */
#other-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: none;
  align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 0.5px solid rgba(255,255,255,0.08);
}
#other-nav.visible { display: flex; }
.other-nav-title { font-family: 'Instrument Serif', serif; font-size: 17px; color: rgba(255,255,255,0.9); }
.other-nav-pills { display: flex; gap: 4px; }
.other-nav-pill {
  height: 32px; padding: 0 13px;
  background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15);
  border-radius: 99px; color: rgba(255,255,255,0.6);
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.other-nav-pill.active { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.35); }

.content { padding: 0; max-width: 600px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; }

/* ═══ ABA MÚSICAS — LISTA ═══ */
#panel-repertorio { position: fixed; inset: 0; z-index: 1; background: #0d0d0d; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#panel-repertorio.active { display: block; }

#cf-nav-overlay {
  position: sticky;
  top: 0; left: 0; right: 0;
  z-index: 50;
  background: rgba(13,13,13,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid rgba(255,255,255,0.1);
  padding: 12px 16px 14px;
}

.cf-nav-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 8px;
}
.cf-nav-title { font-family: 'Instrument Serif', serif; font-size: 17px; color: rgba(255,255,255,0.9); }
.cf-nav-pills { display: flex; gap: 4px; }
.cf-nav-pill {
  height: 32px; padding: 0 13px;
  background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15);
  border-radius: 99px; color: rgba(255,255,255,0.6);
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.cf-nav-pill.active { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.35); }
.cf-nav-pill:hover:not(.active) { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }
.cf-search-row { display: flex; gap: 8px; }
.cf-search-input {
  flex: 1; height: 38px; padding: 0 14px;
  background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2);
  border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: #fff; outline: none;
}
.cf-search-input::placeholder { color: rgba(255,255,255,0.35); }
.cf-search-input:focus { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.14); }
.cf-filter-btn {
  height: 38px; padding: 0 12px;
  background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.18);
  border-radius: 10px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  color: rgba(255,255,255,0.55); cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.cf-filter-btn.on { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); color: #fff; font-weight: 500; }

#cf-count-badge { padding: 6px 16px 2px; font-size: 11px; color: rgba(255,255,255,0.22); }

/* lista de músicas */
.ml-row { border-bottom: 0.5px solid rgba(255,255,255,0.07); -webkit-tap-highlight-color: transparent; }
.ml-summary { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; min-height: 60px; }
.ml-row.open .ml-summary { background: rgba(255,255,255,0.03); }
.ml-cover { 
  width: 42px; 
  height: 42px;
  border-radius: 7px; 
  flex-shrink: 0; 
  background-size: cover; 
  background-position: center; 
  background-repeat: no-repeat; 
  background-color: #1a1a1a; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 14px; 
  font-weight: 500; 
  color: rgba(255,255,255,0.3); }
.ml-info { flex: 1; min-width: 0; }
.ml-title { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ml-artist { font-size: 11px; color: rgba(255,255,255,0.38); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ml-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.ml-plays { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); }
.ml-ago { font-size: 10px; color: rgba(255,255,255,0.25); white-space: nowrap; }
.ml-expand { display: none; padding: 0 16px 14px; background: rgba(255,255,255,0.02); border-top: 0.5px solid rgba(255,255,255,0.06); }
.ml-expand.open { display: block; }
.ml-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; padding-top: 12px; }
.ml-btn { height: 44px; border-radius: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
.ml-btn:active { opacity: 0.75; }
.ml-btn.ml-spotify { background: #1DB954; }
.ml-btn.ml-youtube { background: #FF0000; }
.ml-btn.ml-cifra { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15); font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.65); font-family: 'DM Sans', sans-serif; }
.ml-btn.ml-cifra.disabled { opacity: 0.25; cursor: default; pointer-events: none; }
.ml-btn.disabled-logo { opacity: 0.25; cursor: default; pointer-events: none; }
.ml-btn svg { display: block; }
.ml-stats { display: flex; gap: 8px; margin-bottom: 12px; }
.ml-stat { flex: 1; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 6px; text-align: center; }
.ml-stat-val { font-size: 16px; font-weight: 500; color: #fff; line-height: 1; }
.ml-stat-lbl { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 2px; }
.ml-hist-lbl { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.ml-hist-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 0.5px solid rgba(255,255,255,0.06); font-size: 12px; }
.ml-hist-item:last-child { border-bottom: none; }
.ml-hist-date { color: rgba(255,255,255,0.35); }
.ml-hist-lead { color: #fff; font-weight: 500; }
.ml-hist-tom { background: rgba(255,255,255,0.07); border-radius: 4px; padding: 1px 6px; font-size: 10px; color: rgba(255,255,255,0.4); }

/* ═══ ABA CULTOS — LISTA ═══ */
#panel-cultos { position: fixed; inset: 0; z-index: 1; background: #0d0d0d; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 56px; }
#panel-cultos.active { display: block; }

.cultos-heading { padding: 16px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; }
.cultos-heading-title { font-family: 'Instrument Serif', serif; font-size: 22px; color: #fff; }
.cultos-heading-count { font-size: 12px; color: rgba(255,255,255,0.28); }

.cultos-row { border-bottom: 0.5px solid rgba(255,255,255,0.07); }
.cultos-row-summary {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; min-height: 58px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cultos-row.open .cultos-row-summary { background: rgba(255,255,255,0.03); }

.cultos-date { min-width: 32px; text-align: center; flex-shrink: 0; }
.cultos-date-day { font-size: 20px; font-weight: 500; color: #fff; line-height: 1; }
.cultos-date-month { font-size: 11px; font-weight: 500; margin-top: 2px; letter-spacing: 0.02em; }

.cultos-row-info { flex: 1; min-width: 0; }
.cultos-row-leader { font-size: 14px; font-weight: 500; color: #fff; }

.cultos-chevron {
  font-size: 14px; color: rgba(255,255,255,0.28);
  transition: transform 0.22s; flex-shrink: 0;
  padding: 6px; margin-right: -6px;
}
.cultos-row.open .cultos-chevron { transform: rotate(90deg); }

.cultos-expand { display: none; padding: 0 16px 14px; background: rgba(255,255,255,0.025); border-top: 0.5px solid rgba(255,255,255,0.06); }
.cultos-expand.open { display: block; }

.cultos-section-lbl { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 0.08em; margin: 12px 0 6px; }

.cultos-musica-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
.cultos-musica-row:last-child { border-bottom: none; }
.cultos-musica-nome { flex: 1; font-size: 13px; color: rgba(255,255,255,0.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.cultos-mp3-btn {
  font-size: 11px; font-weight: 500; padding: 7px 13px;
  border-radius: 99px; border: 0.5px solid rgba(93,187,58,0.3);
  background: rgba(93,187,58,0.12); color: #7BBF45;
  cursor: pointer; flex-shrink: 0; min-height: 34px;
  -webkit-tap-highlight-color: transparent;
  font-family: 'DM Sans', sans-serif; transition: background 0.15s;
}
.cultos-mp3-btn:active { background: rgba(93,187,58,0.22); }
.cultos-mp3-btn.playing { background: rgba(93,187,58,0.22); color: #9DDF5F; border-color: rgba(93,187,58,0.5); }
.cultos-mp3-btn.inativo { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.07); cursor: default; }

.cultos-sem-reg { flex: 1; font-size: 13px; font-style: italic; color: rgba(255,255,255,0.2); }
.cultos-more-btn { width: 100%; padding: 16px; background: none; border: none; font-size: 12px; color: rgba(255,255,255,0.22); cursor: pointer; font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

/* cores dos meses */
.m-jan{color:#4FC3A8} .m-fev{color:#5B9BD5} .m-mar{color:#E07040}
.m-abr{color:#7BBF45} .m-mai{color:#F4A835} .m-jun{color:#D4698A}
.m-jul{color:#8C7ED9} .m-ago{color:#E06050} .m-set{color:#3DB88A}
.m-out{color:#C4852A} .m-nov{color:#9B8CC0} .m-dez{color:#E05555}

/* player cultos */
#cultos-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  display: none; flex-direction: column; gap: 8px;
  padding: 10px 16px 14px;
  background: rgba(10,10,10,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(255,255,255,0.1);
}
#cultos-player.vis { display: flex; }
#cultos-player-top { display: flex; align-items: center; gap: 10px; }
#cultos-player-name { flex: 1; font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#cultos-player-btn {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.12); border: 0.5px solid rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
}
#cultos-player-btn:active { background: rgba(255,255,255,0.22); }
#cultos-player-btn svg { width: 13px; height: 13px; fill: #fff; display: block; }
#cultos-player-scrubber { display: flex; flex-direction: column; gap: 3px; }
#cultos-player-track { position: relative; height: 18px; display: flex; align-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#cultos-player-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.14); border-radius: 99px; pointer-events: none; }
#cultos-player-fill { height: 100%; width: 0%; background: #7BBF45; border-radius: 99px; position: relative; pointer-events: none; transition: width 0.4s linear; }
#cultos-player-thumb { position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; pointer-events: none; }
#cultos-player-times { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,0.28); }

/* ── ENSAIO ── */
#panel-ensaio { display: none; padding-top: 76px; }
#panel-ensaio.active { display: block; }
.ensaio-choice-row { display: flex; gap: 12px; margin-bottom: 20px; padding: 0 16px; }
.ensaio-choice-card { flex: 1; border: 1.5px solid var(--border); border-radius: 14px; padding: 20px 12px 16px; background: var(--surface); cursor: pointer; text-align: center; transition: all 0.15s; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ensaio-choice-card:hover { border-color: var(--accent-mid); background: var(--accent-light); }
.ensaio-choice-card.selected { border-color: var(--accent); background: var(--accent-light); }
.ensaio-choice-icon { font-size: 28px; }
.ensaio-choice-lbl { font-size: 14px; font-weight: 600; color: var(--text); }
.ensaio-choice-sub { font-size: 11px; color: var(--muted); }
.ensaio-choice-card.selected .ensaio-choice-lbl { color: var(--accent); }
.ensaio-culto-info { font-size: 12px; color: var(--muted); margin-bottom: 12px; padding: 0 18px; }
.ensaio-song-btn { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; text-align: left; }
.ensaio-song-btn:hover { border-color: var(--accent-mid); background: var(--accent-light); }
.ensaio-song-btn:active { transform: scale(0.99); }
.ensaio-song-num { font-size: 11px; color: var(--muted); width: 20px; flex-shrink: 0; }
.ensaio-song-info { flex: 1; min-width: 0; }
.ensaio-song-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ensaio-song-artist { font-size: 12px; color: var(--muted); margin-top: 1px; }
.ensaio-song-tom { font-size: 11px; font-weight: 600; color: var(--accent-mid); background: var(--accent-light); padding: 3px 9px; border-radius: 99px; flex-shrink: 0; }
.ensaio-song-arrow { font-size: 16px; color: var(--muted); flex-shrink: 0; }
.ensaio-no-culto { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

#ensaio-fs { display: none; position: fixed; inset: 0; z-index: 500; background: #000; overflow: hidden; clip-path: inset(0 0 56px 0); }
#ensaio-fs.open { display: block; }
#ensaio-iframe { position: absolute; top: 0; left: 0; right: 0; bottom: -60px; width: 100%; height: calc(100% - 56px + 60px); border: none; display: block; }
.ensaio-no-cifra { position: absolute; top: 0; left: 0; right: 0; bottom: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: rgba(255,255,255,0.5); font-size: 15px; text-align: center; padding: 32px; background: #0d1a08; }
.ensaio-no-cifra .icon { font-size: 40px; opacity: 0.5; }
.ensaio-ext-link { font-size: 13px; color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); padding: 8px 18px; border-radius: 99px; text-decoration: none; margin-top: 4px; transition: all 0.15s; }
.ensaio-ext-link:hover { background: rgba(255,255,255,0.14); color: #fff; }
#ensaio-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: rgba(10,20,6,0.96); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.08); display: none; align-items: center; z-index: 510; user-select: none; }
#ensaio-bar.open { display: flex; }
.ensaio-bar-btn { flex-shrink: 0; height: 56px; width: 64px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.12s; -webkit-tap-highlight-color: transparent; }
.ensaio-bar-btn:active { background: rgba(255,255,255,0.1); }
.ensaio-bar-btn:disabled { opacity: 0.2; cursor: not-allowed; }
.ensaio-bar-btn.close { color: rgba(255,255,255,0.5); font-size: 18px; }
.ensaio-bar-btn.menu { color: rgba(255,255,255,0.7); font-size: 20px; }
.ensaio-bar-nome { flex: 1; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; padding: 0 4px; pointer-events: none; }
#ensaio-loading { display: none; position: fixed; inset: 0; z-index: 600; background: #0d1a08; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
#ensaio-loading.open { display: flex; }
.ensaio-loading-icon { font-size: 52px; animation: ensaio-pulse 1.6s ease-in-out infinite; }
.ensaio-loading-title { font-family: 'Instrument Serif', serif; font-size: 24px; color: #fff; }
.ensaio-loading-msg { font-size: 13px; color: rgba(255,255,255,0.4); min-height: 20px; transition: opacity 0.3s; }
.ensaio-loading-dots { display: flex; gap: 7px; margin-top: 6px; }
.ensaio-loading-dot { width: 7px; height: 7px; border-radius: 50%; background: #5DBB3A; animation: ensaio-dot 1.2s ease-in-out infinite; }
.ensaio-loading-dot:nth-child(2) { animation-delay: 0.2s; }
.ensaio-loading-dot:nth-child(3) { animation-delay: 0.4s; }
#ensaio-error { display: none; position: fixed; inset: 0; z-index: 600; background: #0d1a08; flex-direction: column; align-items: center; justify-content: center; padding: 40px 28px; text-align: center; gap: 18px; overflow-y: auto; }
#ensaio-error.open { display: flex; }
.ensaio-error-icon { font-size: 52px; }
.ensaio-error-title { font-family: 'Instrument Serif', serif; font-size: 28px; color: #fff; }
.ensaio-error-desc { font-size: 15px; color: rgba(255,255,255,0.5); max-width: 360px; line-height: 1.6; }
.ensaio-error-box { width: 100%; max-width: 440px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,80,80,0.3); border-radius: 14px; padding: 18px 20px; font-family: monospace; font-size: 12px; color: #F87171; text-align: left; word-break: break-all; white-space: pre-wrap; line-height: 1.6; max-height: 220px; overflow-y: auto; }
.ensaio-error-vini { width: 100%; max-width: 440px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 18px; font-size: 13px; color: rgba(255,255,255,0.35); line-height: 1.5; }
.ensaio-error-back { margin-top: 4px; padding: 13px 32px; background: rgba(93,187,58,0.15); border: 1px solid rgba(93,187,58,0.3); color: #5DBB3A; border-radius: 99px; font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
.ensaio-error-back:hover { background: rgba(93,187,58,0.25); }
#ensaio-menu { display: none; position: fixed; inset: 0; z-index: 700; background: rgba(0,0,0,0.6); align-items: flex-end; justify-content: center; }
#ensaio-menu.open { display: flex; }
.ensaio-menu-sheet { background: #111d0b; border-radius: 22px 22px 0 0; width: 100%; max-width: 600px; padding: 18px 16px 40px; max-height: 75vh; overflow-y: auto; }
.ensaio-menu-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 16px; }

<script>
const CSV_MUSICAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS9PvhKg7QA7nAUXvDm3sz2d7PfD1RBL-oJb-1ML1bLzS3onWoUQowJtWdMGlvVJ_Y51CRr8W84ntcV/pub?gid=1727049692&single=true&output=csv';
const CSV_CULTOS  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS9PvhKg7QA7nAUXvDm3sz2d7PfD1RBL-oJb-1ML1bLzS3onWoUQowJtWdMGlvVJ_Y51CRr8W84ntcV/pub?gid=541921551&single=true&output=csv';

let musicas = [], cultos = [];
let filtroNuncaUsadas = false, ordenarPorRecente = false;

// ═══════════════════════════════════════
// PLAYER — usado pelo Cultos
// ═══════════════════════════════════════
const gPlayer = {
  audio: null,
  url: null,
  nome: '',
  artista: '',

  play(url, nome, artista) {
    if (this.audio) { this.audio.pause(); this.audio.src = ''; }
    this.url = url; this.nome = nome; this.artista = artista;
    this.audio = new Audio(url);
    this.audio.play().catch(() => {});
    this.audio.addEventListener('timeupdate', () => this._tick());
    this.audio.addEventListener('loadedmetadata', () => this._tick());
    this.audio.addEventListener('ended', () => { this._updateIcons(false); });
  },

  pause()  { if (this.audio) this.audio.pause(); this._updateIcons(false); },
  resume() { if (this.audio) { this.audio.play(); this._updateIcons(true); } },
  isPlaying() { return this.audio && !this.audio.paused; },
  togglePlayPause() { if (!this.audio) return; if (this.audio.paused) this.resume(); else this.pause(); },

  _tick() {
    if (!this.audio) return;
    const cur = this.audio.currentTime || 0;
    const dur = this.audio.duration   || 0;
    const pct = dur > 0 ? (cur / dur) * 100 : 0;
    const fmt = s => { const m = Math.floor(s/60), ss = Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; };
    const fill = document.getElementById('cultos-player-fill');
    if (fill) fill.style.width = pct + '%';
    const curEl = document.getElementById('cultos-player-cur');
    if (curEl) curEl.textContent = fmt(cur);
    const durEl = document.getElementById('cultos-player-dur');
    if (durEl) durEl.textContent = fmt(dur);
    this._updateIcons(!this.audio.paused);
  },

  _updateIcons(playing) {
    const icon = document.getElementById('cultos-player-icon');
    if (!icon) return;
    icon.innerHTML = playing
      ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  },
};

document.addEventListener('DOMContentLoaded', () => {
  const cpTrack = document.getElementById('cultos-player-track');
  if (cpTrack) {
    cpTrack.addEventListener('click', e => {
      if (!gPlayer.audio || !gPlayer.audio.duration) return;
      const r = cpTrack.getBoundingClientRect();
      gPlayer.audio.currentTime = gPlayer.audio.duration * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    });
  }
});

// ═══════════════════════════════════════
// DADOS
// ═══════════════════════════════════════
async function carregarDados() {
  try {
    const [m, c] = await Promise.all([fetch(CSV_MUSICAS).then(r=>r.text()), fetch(CSV_CULTOS).then(r=>r.text())]);
    musicas = parseCSVMusicas(m);
    cultos  = parseCSVCultos(c);
    renderMusicas();
    renderCultos();
  } catch(e) {
    toast('Erro ao carregar planilha.', true);
  }
}

function parseCSVMusicas(txt) {
  const L = txt.trim().split('\n').slice(3);
  return L.map((ln,idx) => {
    const [nome,artista,cifra,usos,midia] = parseCSVLine(ln);
    return { nome:nome||'', artista:artista||'', cifra:cifra||'', usos:parseInt(usos)||0, midia:midia||'', ordemOriginal:idx };
  }).filter(m=>m.nome).sort((a,b)=>b.usos-a.usos||a.nome.localeCompare(b.nome));
}

function parseCSVCultos(txt) {
  const L = txt.trim().split('\n').slice(1);
  const grupos = {};
  L.forEach(ln => {
    const [data, musica, tom, ministra, usos, mp3, vozes, musicos] = parseCSVLine(ln);
    if (!data || !musica) return;
    if (!grupos[data]) grupos[data] = { data, ministra: ministra||'', musicas: [], vozes: '', musicos: '' };
    if (vozes  && !grupos[data].vozes)   grupos[data].vozes   = vozes.trim();
    if (musicos && !grupos[data].musicos) grupos[data].musicos = musicos.trim();
    grupos[data].musicas.push({ nome: musica, tom: tom||'', usos: parseInt(usos)||0, mp3: mp3||'' });
  });
  return Object.values(grupos).sort((a,b) => parseDataBR(b.data) - parseDataBR(a.data));
}

function parseCSVLine(ln) {
  const C=[]; let v='',inQ=false;
  for (let i=0;i<ln.length;i++) {
    const ch=ln[i],nx=ln[i+1];
    if (ch==='"') { if(inQ&&nx==='"'){v+='"';i++;} else inQ=!inQ; }
    else if (ch===','&&!inQ) { C.push(v); v=''; }
    else v+=ch;
  }
  C.push(v);
  return C.map(s=>s.trim());
}

function parseDataBR(d) {
  const p = d.split('/');
  if (p.length !== 3) return new Date(0);
  let ano = parseInt(p[2]);
  if (ano < 100) ano += 2000;
  return new Date(ano, parseInt(p[1])-1, parseInt(p[0]));
}

function resolveAudioUrl(raw) {
  if (!raw) return null;
  if (raw.includes('cloudinary.com')) return raw;
  const m = raw.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  if (raw.startsWith('http')) return raw;
  return null;
}

function toggleFiltro() { filtroNuncaUsadas=!filtroNuncaUsadas; document.getElementById('filter-nuncausadas').classList.toggle('on',filtroNuncaUsadas); renderMusicas(); }
function toggleOrdenacao() { ordenarPorRecente=!ordenarPorRecente; document.getElementById('filter-recentes').classList.toggle('on',ordenarPorRecente); renderMusicas(); }

// ═══════════════════════════════════════
// MÚSICAS — LISTA
// ═══════════════════════════════════════
let cfCovers = {};
let mlOpenRow = null;

const CF_GRADIENTS = [
  ['#0a3d62','#1D9E75'],['#1a1a2e','#534AB7'],['#2d1b00','#EF9F27'],
  ['#2d0a0a','#E24B4A'],['#0d2137','#378ADD'],['#1a2e0a','#639922'],
  ['#2a0a2a','#D4537E'],['#0a2a2a','#1D9E75'],['#1a0a1a','#B7509E'],
  ['#0a1a2a','#4A7C28'],['#2a1a0a','#BA7517'],['#1a2a1a','#3B6D11'],
];

const CF_CONCURRENCY = 10;
const cfQueue = [];
let cfQueueRunning = 0;

function cfBuscarCapaQueued(musica) {
  const key = musica.nome+'|'+musica.artista;
  if (cfCovers[key] !== undefined) return Promise.resolve(cfCovers[key]);
  return new Promise(resolve => {
    cfQueue.push({ musica, resolve });
    cfDrainQueue();
  });
}

async function cfDrainQueue() {
  if (cfQueueRunning >= CF_CONCURRENCY || cfQueue.length === 0) return;
  const { musica, resolve } = cfQueue.shift();
  cfQueueRunning++;
  const result = await cfBuscarCapa(musica);
  cfQueueRunning--;
  resolve(result);
  cfDrainQueue();
}

function cfGradient(nome) { let h=0; for(let i=0;i<nome.length;i++) h=(h*31+nome.charCodeAt(i))&0xffffffff; return CF_GRADIENTS[Math.abs(h)%CF_GRADIENTS.length]; }
function cfInitials(nome) { return nome.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'♪'; }

async function cfBuscarCapa(musica) {
  const key = musica.nome+'|'+musica.artista;
  if (cfCovers[key] !== undefined) return cfCovers[key];
  cfCovers[key] = null;
  try {
    const params = new URLSearchParams({ nome: musica.nome });
    if (musica.artista) params.append('artista', musica.artista);
    const r = await Promise.race([
      fetch(`/.netlify/functions/itunes?${params}`),
      new Promise((_,rej) => setTimeout(()=>rej(),6000))
    ]);
    const d = await r.json();
    if (d.results?.length > 0) {
      const item = d.results[0];
      cfCovers[key] = { img: (item.artworkUrl100 || '').replace('100x100bb', '200x200bb') };
      return cfCovers[key];
    }
  } catch(e) {}
  cfCovers[key] = { img:null };
  return cfCovers[key];
}

function renderMusicas() {
  const q = document.getElementById('search-musicas').value.toLowerCase();
  let lista = musicas.filter(m=>(m.nome.toLowerCase().includes(q)||m.artista.toLowerCase().includes(q))&&(!filtroNuncaUsadas||m.usos===0));
  if (ordenarPorRecente) {
    lista.forEach(m => {
      let ud=null;
      cultos.forEach(c=>{if(c.musicas.some(cm=>cm.nome.toLowerCase()===m.nome.toLowerCase())){const d=parseDataBR(c.data);if(!ud||d>ud)ud=d;}});
      m.ultimaData=ud;
    });
    lista.sort((a,b)=>{if(!a.ultimaData&&!b.ultimaData)return a.nome.localeCompare(b.nome);if(!a.ultimaData)return 1;if(!b.ultimaData)return -1;if(a.ultimaData.getTime()!==b.ultimaData.getTime())return b.ultimaData-a.ultimaData;return a.nome.localeCompare(b.nome);});
  } else {
    lista.sort((a,b)=>b.usos-a.usos||a.nome.localeCompare(b.nome));
  }
  const countEl = document.getElementById('cf-count-badge');
  if (countEl) countEl.textContent = lista.length + ' músicas';
  const container = document.getElementById('musicas-list');
  if (!container) return;
  container.innerHTML = '';
  mlOpenRow = null;
  lista.forEach(m => container.appendChild(buildMusicaRow(m)));
}

function buildMusicaRow(m) {
  const grad = cfGradient(m.nome);
  const cover = cfCovers[m.nome+'|'+m.artista];
  const idxU = cultos.findIndex(c=>c.musicas.some(cm=>cm.nome.toLowerCase()===m.nome.toLowerCase()));
  const agoStr = idxU === 0 ? 'Último culto' : idxU > 0 ? `${idxU} culto${idxU!==1?'s':''} atrás` : m.usos > 0 ? '—' : 'nunca tocada';

  const row = document.createElement('div');
  row.className = 'ml-row';

  const coverStyle = cover?.img
    ? `background-image:url('${cover.img}');`
    : `background:linear-gradient(135deg,${grad[0]},${grad[1]}88);`;

  row.innerHTML = `
    <div class="ml-summary">
      <div class="ml-cover" style="${coverStyle}">${cover?.img ? '' : cfInitials(m.nome)}</div>
      <div class="ml-info">
        <div class="ml-title">${esc(m.nome)}</div>

      </div>

        <div class="ml-plays">${m.usos}×</div>

  return row;
}

  const youtubeSVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>`;

  expand.innerHTML = `

      <button class="ml-btn ml-cifra${cifras.length?'':' disabled'}"${cifras.length?'':' disabled'}>♩ Cifra</button>

    <div class="ml-stats">
      <div class="ml-stat"><div class="ml-stat-val">${m.usos}</div><div class="ml-stat-lbl">cultos</div></div>
      <div class="ml-stat"><div class="ml-stat-val">${esc(tomFreq)}</div><div class="ml-stat-lbl">tom freq.</div></div>

// CULTOS — LISTA
// ═══════════════════════════════════════
const CULTOS_MES_S   = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CULTOS_MES_CLS = ['m-jan','m-fev','m-mar','m-abr','m-mai','m-jun','m-jul','m-ago','m-set','m-out','m-nov','m-dez'];
const CULTOS_PAGE = 20;

let cultosList = [];
let cultosPage = 0;
let cultoAudioBtn = null;

function leaderDotColor(nome) {
  const n = (nome || '').toLowerCase();
  if (n.includes('gabi'))                          return '#7BBF45';
  if (n.includes('pamela') || n.includes('pâmela')) return '#8C7ED9';
  if (n.includes('erica')  || n.includes('érica'))  return '#E07040';
  const pool = ['#4FC3A8','#5B9BD5','#F4A835','#D4698A','#9B8CC0','#C4852A'];
  let h = 0;
  for (const c of (nome || '')) h = (h * 31 + c.charCodeAt(0)) & 0x7fffffff;
  return pool[h % pool.length];
}

function buildCultosList() {
  const list = [];
  for (let i = 0; i < cultos.length; i++) {
    list.push({ type: 'culto', data: cultos[i] });
    if (i < cultos.length - 1) {
      const d1 = parseDataBR(cultos[i].data);
      const d2 = parseDataBR(cultos[i + 1].data);
      const diffDays = Math.round((d1 - d2) / 86400000);
      const gaps = Math.floor(diffDays / 7) - 1;
      for (let g = 1; g <= gaps; g++) {
        const d = new Date(d1);
        d.setDate(d.getDate() - g * 7);
        list.push({ type: 'empty', date: d });
      }
    }
  }
  return list;
}

function renderCultos() {
  cultosList = buildCultosList();
  cultosPage = 0;
  const el = document.getElementById('cultos-list');
  if (!el) return;
  el.innerHTML = '';
  const countEl = document.getElementById('cultos-heading-count');
  if (countEl) countEl.textContent = cultos.length + ' cultos';
  appendCultosPage();
}

function appendCultosPage() {
  const el = document.getElementById('cultos-list');
  const oldBtn = el.querySelector('.cultos-more-btn');
  if (oldBtn) oldBtn.remove();
  const end = Math.min(cultosList.length, cultosPage + CULTOS_PAGE);
  for (let i = cultosPage; i < end; i++) {
    el.appendChild(buildCultoRow(i));
  }
  cultosPage = end;
  if (cultosPage < cultosList.length) {
    const btn = document.createElement('button');
    btn.className = 'cultos-more-btn';
    btn.textContent = '+ ver mais';
    btn.onclick = appendCultosPage;
    el.appendChild(btn);
  }
}

function buildCultoRow(i) {
  const item = cultosList[i];
  const div = document.createElement('div');

  if (item.type === 'empty') {
    const d = item.date;
    const m = d.getMonth();
    div.className = 'cultos-row';
    div.style.opacity = '0.38';
    div.style.pointerEvents = 'none';
    div.innerHTML = `<div class="cultos-row-summary"><div class="cultos-date"><div class="cultos-date-day">${d.getDate()}</div><div class="cultos-date-month ${CULTOS_MES_CLS[m]}">${CULTOS_MES_S[m]}</div></div><span class="cultos-sem-reg">sem registro</span></div>`;
    return div;
  }

  const c = item.data;
  const d = parseDataBR(c.data);
  const m = d.getMonth();

  div.className = 'cultos-row';
  div.innerHTML = `<div class="cultos-row-summary"><div class="cultos-date"><div class="cultos-date-day">${d.getDate()}</div><div class="cultos-date-month ${CULTOS_MES_CLS[m]}">${CULTOS_MES_S[m]}</div></div><div class="cultos-row-info"><div class="cultos-row-leader">${esc(c.ministra || '—')}</div></div><span class="cultos-chevron">›</span></div><div class="cultos-expand"></div>`;

  div.querySelector('.cultos-row-summary').addEventListener('click', () => toggleCultoRow(div, c));
  return div;
}

function toggleCultoRow(rowEl, culto) {
  const expand = rowEl.querySelector('.cultos-expand');
  const isOpen = rowEl.classList.contains('open');

  document.querySelectorAll('#cultos-list .cultos-row.open').forEach(r => {
    r.classList.remove('open');
    const ex = r.querySelector('.cultos-expand');
    ex.classList.remove('open');
    ex.innerHTML = '';
  });

  if (isOpen) return;

  rowEl.classList.add('open');
  expand.classList.add('open');

  if (culto.vozes) {
    const lbl = document.createElement('div');
    lbl.className = 'cultos-section-lbl';
    lbl.textContent = 'Vozes';
    expand.appendChild(lbl);
    const row = document.createElement('div');
    row.style.cssText = 'padding: 4px 0 10px; font-size: 13px; color: rgba(255,255,255,0.65);';
    row.textContent = culto.vozes;
    expand.appendChild(row);
  }

  if (culto.musicos) {
    const lbl = document.createElement('div');
    lbl.className = 'cultos-section-lbl';
    lbl.textContent = 'Músicos';
    expand.appendChild(lbl);
    const grid = document.createElement('div');
    grid.style.cssText = 'display:flex;flex-direction:column;gap:3px;padding-bottom:10px;';
    culto.musicos.split(',').map(s => s.trim()).filter(Boolean).forEach(entry => {
      const parts = entry.split(':');
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:6px;font-size:13px;';
      if (parts.length >= 2) {
        const instr = document.createElement('span');
        instr.style.cssText = 'color:rgba(255,255,255,0.3);min-width:64px;';
        instr.textContent = parts[0].trim();
        const nome = document.createElement('span');
        nome.style.cssText = 'color:rgba(255,255,255,0.82);';
        nome.textContent = parts.slice(1).join(':').trim();
        row.appendChild(instr); row.appendChild(nome);
      } else {
        row.style.color = 'rgba(255,255,255,0.65)';
        row.textContent = entry;
      }
      grid.appendChild(row);
    });
    expand.appendChild(grid);
  }

  const lbl = document.createElement('div');
  lbl.className = 'cultos-section-lbl';
  lbl.textContent = 'Músicas';
  expand.appendChild(lbl);

  culto.musicas.forEach(m => {
    const row = document.createElement('div');
    row.className = 'cultos-musica-row';

    const nome = document.createElement('span');
    nome.className = 'cultos-musica-nome';
    nome.textContent = m.nome;
    row.appendChild(nome);

    const audioUrl = resolveAudioUrl(m.mp3);
    const btn = document.createElement('button');
    if (audioUrl) {
      btn.className = 'cultos-mp3-btn';
      btn.textContent = '▶ MP3';
      btn.addEventListener('click', () => handleCultoMp3(btn, audioUrl, m.nome));
    } else {
      btn.className = 'cultos-mp3-btn inativo';
      btn.textContent = 'MP3';
      btn.disabled = true;
    }
    row.appendChild(btn);
    expand.appendChild(row);
  });

  setTimeout(() => rowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function handleCultoMp3(btn, url, nome) {
  if (cultoAudioBtn === btn) {
    if (gPlayer.isPlaying()) {
      gPlayer.pause();
      btn.textContent = '▶ MP3';
      btn.classList.remove('playing');
      cultosPlayerUpdateIcon(false);
    } else {
      gPlayer.resume();
      btn.textContent = '⏸ MP3';
      btn.classList.add('playing');
      cultosPlayerUpdateIcon(true);
    }
    return;
  }
  if (cultoAudioBtn) {
    cultoAudioBtn.textContent = '▶ MP3';
    cultoAudioBtn.classList.remove('playing');
  }
  cultoAudioBtn = btn;
  btn.textContent = '⏸ MP3';
  btn.classList.add('playing');
  const playerEl = document.getElementById('cultos-player');
  const playerName = document.getElementById('cultos-player-name');
  if (playerEl) { playerEl.classList.add('vis'); document.getElementById('panel-cultos').style.paddingBottom = '84px'; }
  if (playerName) playerName.textContent = nome;
  cultosPlayerUpdateIcon(true);
  gPlayer.play(url, nome, '');
  if (gPlayer.audio) {
    gPlayer.audio.addEventListener('ended', () => {
      if (cultoAudioBtn === btn) {
        btn.textContent = '▶ MP3';
        btn.classList.remove('playing');
        cultoAudioBtn = null;
        cultosPlayerHide();
      }
    }, { once: true });
  }
}

function cultosPlayerUpdateIcon(playing) {
  const icon = document.getElementById('cultos-player-icon');
  if (!icon) return;
  icon.innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function cultosPlayerHide() {
  const playerEl = document.getElementById('cultos-player');
  if (playerEl) playerEl.classList.remove('vis');
  document.getElementById('panel-cultos').style.paddingBottom = '';
  const fill = document.getElementById('cultos-player-fill');
  if (fill) fill.style.width = '0%';
  const curEl = document.getElementById('cultos-player-cur');
  if (curEl) curEl.textContent = '0:00';
  const durEl = document.getElementById('cultos-player-dur');
  if (durEl) durEl.textContent = '0:00';
  cultosPlayerUpdateIcon(false);
}

function handleCultosPlayerToggle() {
  if (!cultoAudioBtn) return;
  if (gPlayer.isPlaying()) {
    gPlayer.pause();
    cultoAudioBtn.textContent = '▶ MP3';
    cultoAudioBtn.classList.remove('playing');
    cultosPlayerUpdateIcon(false);
  } else {
    gPlayer.resume();
    cultoAudioBtn.textContent = '⏸ MP3';
    cultoAudioBtn.classList.add('playing');
    cultosPlayerUpdateIcon(true);
  }
}

function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.cf-nav-pill,.other-nav-pill').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  if (btn) btn.classList.add('active');

  if (id !== 'cultos' && cultoAudioBtn) {
    gPlayer.pause();
    cultoAudioBtn.textContent = '▶ MP3';
    cultoAudioBtn.classList.remove('playing');
    cultoAudioBtn = null;
    cultosPlayerHide();
  }

  if (id === 'repertorio') {
    document.getElementById('other-nav').classList.remove('visible');
  } else {
    document.getElementById('other-nav').classList.add('visible');
    document.querySelectorAll('.other-nav-pill').forEach(p => {
      const t = p.textContent.toLowerCase();
      if (id === 'cultos' && t.includes('culto')) p.classList.add('active');
      if (id === 'ensaio' && t.includes('ensaio')) p.classList.add('active');
      if (id === 'dados' && t.includes('dados')) p.classList.add('active');
    });
    if (id === 'ensaio') renderEnsaioTab();
    if (id === 'cultos') renderCultos();
    if (id === 'dados') renderDados();
  }
}

const PERSON_COLORS = {
  'gabi':   { bg:'rgba(99,153,34,0.2)',   color:'#7BBF45' },
  'pamela': { bg:'rgba(155,140,192,0.2)', color:'#9B8CC0' },
  'pâmela': { bg:'rgba(155,140,192,0.2)', color:'#9B8CC0' },
  'erica':  { bg:'rgba(224,112,64,0.2)',  color:'#E07040' },
  'érica':  { bg:'rgba(224,112,64,0.2)',  color:'#E07040' },
};
const PERSON_COLOR_POOL = [
  { bg:'rgba(239,159,39,0.2)',  color:'#F4A835' },
  { bg:'rgba(29,158,117,0.2)', color:'#3DB88A' },
  { bg:'rgba(55,138,221,0.2)', color:'#5B9BD5' },
  { bg:'rgba(212,105,138,0.2)',color:'#D4698A' },
  { bg:'rgba(196,133,42,0.2)', color:'#C4852A' },
  { bg:'rgba(79,195,168,0.2)', color:'#4FC3A8' },
];
const personColorCache = {};
let personColorIdx = 0;

function getPersonColor(nome) {
  const key = (nome||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (personColorCache[key]) return personColorCache[key];
  const named = PERSON_COLORS[nome.toLowerCase()];
  if (named) { personColorCache[key] = named; return named; }
  const c = PERSON_COLOR_POOL[personColorIdx % PERSON_COLOR_POOL.length];
  personColorIdx++;
  personColorCache[key] = c;
  return c;
}

function normalizarNome(n) {
  return (n||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function renderDados() {
  const panel = document.getElementById('panel-dados');
  panel.innerHTML = `
    <div class="dados-hero">
      <div class="dados-hero-eyebrow">Ministério de Louvor</div>
      <div class="dados-hero-title">Quem convocar?</div>
      <div class="dados-hero-sub">Ordenado por quem toca há mais tempo · ${cultos.length} cultos registrados</div>
    </div>
    <div class="dados-dot-legend">
      <span class="dados-dot-legend-lbl">+ antigo</span>
      <div class="dados-dot-legend-dots" id="dados-legend-dots"></div>
      <span class="dados-dot-legend-lbl">+ recente</span>
    </div>
    <div id="dados-body"></div>`;

  const legendDots = document.getElementById('dados-legend-dots');
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'pdot ' + (i >= 4 ? 'on' : 'off');
    legendDots.appendChild(d);
  }

  renderRosterByRole(document.getElementById('dados-body'));
}

function renderRosterByRole(body) {
  const N = 6;

  const roleMap = {};
  const addPerson = (nome, role, idx) => {
    nome = nome.trim();
    if (!nome) return;
    if (!roleMap[role]) roleMap[role] = {};
    const key = normalizarNome(nome);
    if (!roleMap[role][key]) roleMap[role][key] = { nome, appearances: new Set() };
    roleMap[role][key].appearances.add(idx);
  };

  cultos.forEach((c, idx) => {
    if (c.ministra) addPerson(c.ministra, 'Ministrou', idx);
    if (c.vozes) c.vozes.split(/,| e /i).map(v => v.trim()).filter(Boolean).forEach(v => addPerson(v, 'Voz', idx));
    if (c.musicos) c.musicos.split(',').forEach(entry => {
      const parts = entry.split(':');
      if (parts.length >= 2) {
        const instr = parts[0].trim();
        parts.slice(1).join(':').split(/ e /i).map(n => n.trim()).filter(Boolean).forEach(n => addPerson(n, instr, idx));
      }
    });
  });

  const fixedOrder = ['Ministrou', 'Voz'];
  const otherRoles = Object.keys(roleMap).filter(r => !fixedOrder.includes(r)).sort();
  const roleOrder = [...fixedOrder.filter(r => roleMap[r]), ...otherRoles];

  const getInitials = nome => {
    const w = nome.split(' ').filter(Boolean);
    return w.length >= 2 ? (w[0][0] + w[1][0]).toUpperCase() : nome.slice(0, 2).toUpperCase();
  };

  body.innerHTML = '';

  roleOrder.forEach(role => {
    if (!roleMap[role]) return;

    const people = Object.values(roleMap[role])
      .map(p => ({ ...p, lastIdx: Math.min(...p.appearances) }))
      .sort((a, b) => b.lastIdx - a.lastIdx);

    const group = document.createElement('div');
    group.className = 'dados-role-group';

    const hdr = document.createElement('div');
    hdr.className = 'dados-role-hdr';
    hdr.innerHTML = `<span class="dados-role-name">${esc(role)}</span><span class="dados-role-count">${people.length}</span>`;
    group.appendChild(hdr);

    people.forEach(p => {
      const col = getPersonColor(p.nome);
      const row = document.createElement('div');
      row.className = 'dados-person-row';

      // Dots: left = oldest, right = most recent
      // cultos[0] = most recent (idx 0), cultos[N-1] = oldest shown (idx N-1)
      // Dot position 0 (leftmost) = cultoIdx N-1, dot position N-1 (rightmost) = cultoIdx 0
      const dotsHtml = Array.from({length: N}, (_, i) => {
        const cultoIdx = N - 1 - i;
        const present = p.appearances.has(cultoIdx);
        return `<div class="pdot ${present ? 'on' : 'off'}"></div>`;
      }).join('');

      const lastIdx = p.lastIdx;
      const badgeClass = lastIdx === 0 ? 'green' : lastIdx <= 2 ? 'yellow' : 'red';
      const badgeText = lastIdx === 0 ? 'último' : `${lastIdx} atrás`;

      row.innerHTML = `
        <div class="dados-person-avatar" style="background:${col.bg};color:${col.color};">${getInitials(p.nome)}</div>
        <span class="dados-person-name">${esc(p.nome)}</span>
        <div class="dados-person-dots">${dotsHtml}</div>
        <div class="dados-ago-badge ${badgeClass}">${badgeText}</div>`;

      group.appendChild(row);
    });

    body.appendChild(group);
  });
}

// ═══════════════════════════════════════
const HOLYRICS_URL = 'http://10.10.10.38:8060/view/standard';
const LOADING_MSGS=['Afinando as cordas…','Buscando cifras no Drive…','Preparando o setlist…','Quase lá…','Carregando partituras…','Chegando já…'];
let ensaioMusicas=[],ensaioIdx=0,ensaioWakeLock=null,loadingMsgInterval=null;
let touchStartX=0,touchStartY=0,ensaioPerfil=null;

function renderEnsaioTab(){document.getElementById('ensaio-instrumentista-area').style.display='none';document.querySelectorAll('.ensaio-choice-card').forEach(c=>c.classList.remove('selected'));ensaioPerfil=null;}
function selecionarPerfil(perfil){
  ensaioPerfil=perfil;document.querySelectorAll('.ensaio-choice-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('choice-'+perfil).classList.add('selected');
  if(perfil==='vocalista'){abrirHolyrics();return;}
  document.getElementById('ensaio-instrumentista-area').style.display='block';renderSongList();
}
function renderSongList(){
  const infoEl=document.getElementById('ensaio-culto-info'),listEl=document.getElementById('ensaio-song-list');
  if(!cultos.length){infoEl.textContent='';listEl.innerHTML='<div class="ensaio-no-culto">Nenhum culto registrado ainda.</div>';return;}
  const c=cultos[0];
  infoEl.innerHTML='<strong>'+esc(c.data)+'</strong> &middot; '+c.musicas.length+' m&uacute;sica'+(c.musicas.length!==1?'s':'')+' &middot; '+(esc(c.ministra)||'&mdash;');
  ensaioMusicas=c.musicas.map(m=>{const info=musicas.find(x=>x.nome.toLowerCase()===m.nome.toLowerCase());const cStr=info?.cifra||'';return{nome:m.nome,artista:info?.artista||'',tom:m.tom||'',driveId:extrairDriveId(cStr),linksExternos:extrairLinksExternos(cStr)};});
  listEl.innerHTML=ensaioMusicas.map((m,i)=>`<button class="ensaio-song-btn" onclick="abrirCifra(${i})"><div class="ensaio-song-num">${i+1}.</div><div class="ensaio-song-info"><div class="ensaio-song-name">${esc(m.nome)}</div>${m.artista?`<div class="ensaio-song-artist">${esc(m.artista)}</div>`:''}</div>${m.tom?`<div class="ensaio-song-tom">${esc(m.tom)}</div>`:''}<div class="ensaio-song-arrow">&#x203a;</div></button>`).join('');
}
function abrirCifra(idx){ensaioIdx=idx;mostrarLoadingEnsaio();setTimeout(()=>{esconderLoadingEnsaio();abrirEnsaioFs();},1200);}
function abrirHolyrics(){document.getElementById('holyrics-iframe').src=HOLYRICS_URL;document.getElementById('holyrics-fs').style.display='block';document.body.style.overflow='hidden';if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(wl=>ensaioWakeLock=wl).catch(()=>{});}
function fecharHolyrics(){document.getElementById('holyrics-fs').style.display='none';document.getElementById('holyrics-iframe').src='';document.body.style.overflow='';if(ensaioWakeLock){ensaioWakeLock.release().catch(()=>{});ensaioWakeLock=null;}document.querySelectorAll('.ensaio-choice-card').forEach(c=>c.classList.remove('selected'));ensaioPerfil=null;}
function extrairDriveId(s){if(!s)return null;const urls=s.match(/https?:\/\/[^\s]+/g)||[];for(const u of urls){const m=u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);if(m)return m[1];}return null;}
function extrairLinksExternos(s){if(!s)return[];return(s.match(/https?:\/\/[^\s]+/g)||[]).filter(u=>!u.includes('drive.google.com/file'));}
function mostrarLoadingEnsaio(){const el=document.getElementById('ensaio-loading-msg');let i=0;el.textContent=LOADING_MSGS[0];el.style.opacity='1';loadingMsgInterval=setInterval(()=>{el.style.opacity='0';setTimeout(()=>{i=(i+1)%LOADING_MSGS.length;el.textContent=LOADING_MSGS[i];el.style.opacity='1';},250);},900);document.getElementById('ensaio-loading').classList.add('open');}
function esconderLoadingEnsaio(){clearInterval(loadingMsgInterval);document.getElementById('ensaio-loading').classList.remove('open');}
async function abrirEnsaioFs(){
  document.getElementById('ensaio-fs').classList.add('open');document.getElementById('ensaio-bar').classList.add('open');document.body.style.overflow='hidden';
  renderEnsaioSlide();
  try{if('wakeLock'in navigator)ensaioWakeLock=await navigator.wakeLock.request('screen');}catch(e){}
  document.getElementById('ensaio-fs').addEventListener('touchstart',onEnsaioTouchStart,{passive:true});
  document.getElementById('ensaio-fs').addEventListener('touchend',onEnsaioTouchEnd,{passive:true});
}
function fecharEnsaio(){
  document.getElementById('ensaio-fs').classList.remove('open');document.getElementById('ensaio-bar').classList.remove('open');
  document.getElementById('ensaio-iframe').src='';document.getElementById('ensaio-no-cifra-msg').style.display='none';
  document.body.style.overflow='';fecharMenuEnsaio();
  if(ensaioWakeLock){ensaioWakeLock.release().catch(()=>{});ensaioWakeLock=null;}
  document.getElementById('ensaio-fs').removeEventListener('touchstart',onEnsaioTouchStart);
  document.getElementById('ensaio-fs').removeEventListener('touchend',onEnsaioTouchEnd);
}
function renderEnsaioSlide(){
  const m=ensaioMusicas[ensaioIdx],total=ensaioMusicas.length,iframe=document.getElementById('ensaio-iframe'),noMsg=document.getElementById('ensaio-no-cifra-msg');
  const nome=m.nome.length>28?m.nome.slice(0,26)+'…':m.nome;
  document.getElementById('ensaio-bar-nome').textContent=nome;
  document.getElementById('ensaio-prev').disabled=ensaioIdx===0;
  document.getElementById('ensaio-next').disabled=ensaioIdx===total-1;
  if(m.driveId){iframe.src='https://drive.google.com/file/d/'+m.driveId+'/preview?rm=minimal';iframe.style.display='block';noMsg.style.display='none';}
  else{iframe.src='';iframe.style.display='none';let html='<div class="icon">&#127925;</div><div>'+esc(m.nome)+'</div>';if(m.linksExternos.length)html+=m.linksExternos.map(u=>'<a href="'+esc(u)+'" class="ensaio-ext-link" target="_blank" rel="noopener">&#8599; Abrir cifra externa</a>').join('');else html+='<div style="font-size:13px;opacity:0.6;">Sem cifra cadastrada.</div>';noMsg.innerHTML=html;noMsg.style.display='flex';}
}
function navegarEnsaio(dir){const n=ensaioIdx+dir;if(n<0||n>=ensaioMusicas.length)return;ensaioIdx=n;renderEnsaioSlide();}
function onEnsaioTouchStart(e){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;}
function onEnsaioTouchEnd(e){if(e.touches.length>0)return;const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>55)navegarEnsaio(dx<0?1:-1);}
document.addEventListener('keydown',e=>{
  if(document.getElementById('ensaio-fs').classList.contains('open')){
    if(e.key==='ArrowRight'||e.key==='ArrowDown')navegarEnsaio(1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')navegarEnsaio(-1);
    if(e.key==='Escape')fecharEnsaio();
  }
});
function abrirMenuEnsaio(){
  document.getElementById('ensaio-menu-list').innerHTML=ensaioMusicas.map((m,i)=>`<div class="ensaio-menu-item ${i===ensaioIdx?'active':''}" onclick="irParaMusica(${i})"><div class="ensaio-menu-num">${i+1}</div><div class="ensaio-menu-info"><div class="ensaio-menu-nome">${esc(m.nome)}</div><div class="ensaio-menu-meta">${m.artista||''}${m.tom?' &middot; Tom '+esc(m.tom):''}</div></div>${i===ensaioIdx?'<div class="ensaio-menu-playing">&#9654;</div>':''}</div>`).join('');
  document.getElementById('ensaio-menu').classList.add('open');
}
function fecharMenuEnsaio(){document.getElementById('ensaio-menu').classList.remove('open');}
function irParaMusica(idx){ensaioIdx=idx;fecharMenuEnsaio();renderEnsaioSlide();}
function mostrarErroEnsaio(msg){esconderLoadingEnsaio();document.getElementById('ensaio-error-box').textContent=msg;document.getElementById('ensaio-error').classList.add('open');}
function fecharErroEnsaio(){document.getElementById('ensaio-error').classList.remove('open');}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,erro=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(erro?' erro':'');setTimeout(()=>t.className='toast',3000);}

carregarDados();
</script>
</body>
</html>
